# Rollen-Registry v1.2 (Sprint 3, T-0028: ARCH/DEV/TEST aktiv) — Besetzung und Provider-Kette je Rolle und Aufgaben-Typ.
#
# Schema:
#   roles.<ROLLE>:
#     name, processes, besetzung (script|ki|mensch), status (draft|active|planned)
#     model_tier: strong|standard|cheap  (Default-Modellstufe, guardrails.yaml: providers.claude.models)
#     provider_chain: [..]               (Default-Kette der Rolle; Pyramide: script -> ollama -> copilot -> claude -> mensch)
#     script_tasks: [..]                 (Aufgaben-Typen mit Skript-Route — IMMER vor LLM prüfen)
#     aufgaben_typen:                    (v1: Feinsteuerung je Aufgaben-Typ; überschreibt Default)
#       <typ>: { chain: [..], tier: .., gate_relevant: true|false }
#   Auflösung durch den Orchestrator:
#     1. Aufgaben-Typ in script_tasks?           -> Skript-Route, kein LLM.
#     2. aufgaben_typen.<typ> vorhanden?         -> dessen chain/tier.
#     3. sonst                                   -> provider_chain + model_tier der Rolle.
#   gate_relevant: true erzwingt routing.gate_relevant aus guardrails.yaml (nur claude.strong).
#   Nicht verfügbare Provider (status planned, offline, Budget) -> nächste Stufe der Kette (on_unavailable).

roles:
  PL:
    name: Projektleiter
    processes: [MAN.3]
    besetzung: ki
    model_tier: strong
    provider_chain: [claude]
    script_tasks: [board-hygiene, kosten-report]
    aufgaben_typen:
      sprint-planning:      { chain: [claude], tier: strong }
      dr-qualifizierung:    { chain: [claude], tier: strong, gate_relevant: true }
      sprint-report:        { chain: [claude], tier: standard }
      risikoliste-pflege:   { chain: [claude], tier: standard }
      status-zusammenfassung: { chain: [ollama, claude], tier: cheap }   # ollama ab Sprint 6
    status: active            # Rollenkarte v1 (T-0001)
  CM:
    name: Konfigurationsmanager
    processes: [SUP.8]
    besetzung: ki
    model_tier: standard
    provider_chain: [claude]
    script_tasks: [baseline-manifest, repo-sync, backup-check, template-sync, board-generierung]
    aufgaben_typen:
      cm-strategie:         { chain: [ollama, session, claude], tier: standard }  # API-frei möglich (T-0011/T-0012)
      baseline-freigabe:    { chain: [claude], tier: strong, gate_relevant: true }
      runbook-pflege:       { chain: [ollama, claude], tier: cheap }     # ollama ab Sprint 6
      geraete-onboarding:   { chain: [claude], tier: standard }          # Mensch-Gate via guardrails
    status: active            # Rollenkarte v1 (T-0001)
  COACH:
    name: Prozess-Coach
    processes: [PIM.3, MAN.6]
    besetzung: ki
    model_tier: strong
    provider_chain: [claude]
    script_tasks: [kpi-erhebung, feedback-zuordnung]
    aufgaben_typen:
      retro-moderation:     { chain: [claude], tier: strong }
      wissensbasis-kuratierung: { chain: [claude], tier: strong }
      prozess-cr:           { chain: [claude], tier: standard }
      entwurf-zusammenfassung: { chain: [ollama, claude], tier: cheap }  # ollama ab Sprint 6
    status: active            # Rollenkarte v1 (T-0001)
  RM:
    name: Requirements-Manager
    processes: [SYS.1, SWE.1]
    besetzung: ki
    model_tier: strong
    provider_chain: [claude]
    script_tasks: [trace-report]
    aufgaben_typen:
      requirements-set:     { chain: [session, claude], tier: strong }   # API-frei möglich (Session-Engineering)
      clarification-buendelung: { chain: [ollama, claude], tier: cheap } # ollama ab Sprint 6
      g1-vorlage:           { chain: [claude], tier: strong, gate_relevant: true }
    status: active            # Rollenkarte v1 (T-0019)
  QM:
    name: Qualitätsmanager
    processes: [SUP.1]
    besetzung: ki
    model_tier: strong
    provider_chain: [claude]  # gate-relevant: nur Claude
    script_tasks: [checklisten-check, link-check]
    aufgaben_typen:
      finding-bewertung:    { chain: [claude], tier: strong, gate_relevant: true }
      artefakt-review:      { chain: [session, claude], tier: standard }
    status: active            # Rollenkarte v1 (T-0019)
  PROB:
    name: Problemmanager
    processes: [SUP.9]
    besetzung: ki
    model_tier: standard
    provider_chain: [ollama, claude]
    script_tasks: [ticket-routing, trend-report]
    aufgaben_typen:
      problem-klassifikation: { chain: [ollama, session, claude], tier: standard }
      ursachenanalyse:      { chain: [claude], tier: strong }
    status: active            # Rollenkarte v1 (T-0019)
  CHG:
    name: Change-Manager
    processes: [SUP.10]
    besetzung: ki
    model_tier: standard
    provider_chain: [claude]
    aufgaben_typen:
      cr-erfassung:         { chain: [ollama, session, claude], tier: cheap }
      impact-analyse:       { chain: [claude], tier: strong }
    status: active            # Rollenkarte v1 (T-0019)
  ARCH:
    name: Architekt
    processes: [SWE.2]
    besetzung: ki
    model_tier: strong
    provider_chain: [session, claude]
    aufgaben_typen:
      architektur-entwurf:  { chain: [session, claude], tier: strong }
      adr:                  { chain: [session, claude], tier: strong }
      g2-vorlage:           { chain: [claude], tier: strong, gate_relevant: true }
      machbarkeits-review:  { chain: [session, claude], tier: standard }
    status: active            # Rollenkarte v1 (T-0028)
  DEV:
    name: Entwickler
    processes: [SWE.3]
    besetzung: ki
    model_tier: strong
    provider_chain: [session, claude]   # copilot-Kettenstufe folgt mit PoC Sprint 6 (F13)
    script_tasks: [formatierung, lint]
    aufgaben_typen:
      implementierung:      { chain: [session, claude], tier: strong }
      bugfix:               { chain: [session, claude], tier: standard }
      code-review:          { chain: [session, claude], tier: standard }
      entwurf-zusammenfassung: { chain: [ollama, session, claude], tier: cheap }
    status: active            # Rollenkarte v1 (T-0028); Sprint 1-2: DEV-Tickets liefen im Session-Kontext
  TEST:
    name: Verifikationsingenieur
    processes: [SWE.4, SWE.5, SWE.6]
    besetzung: ki
    model_tier: standard
    provider_chain: [session, claude]   # copilot-Kettenstufe folgt mit PoC Sprint 6 (F13)
    script_tasks: [testlauf, coverage-report, trace-matrix]
    aufgaben_typen:
      testfall-ableitung:   { chain: [session, claude], tier: standard }
      verifikationsstrategie: { chain: [claude], tier: strong }
      testbericht:          { chain: [ollama, session, claude], tier: cheap }
    status: active            # Rollenkarte v1 (T-0028)
  REL:
    name: Release-Manager
    processes: [SPL.2]
    besetzung: ki
    wahrgenommen_durch: CM    # Stufe 1
    script_tasks: [release-paket, katalog-eintrag]
    status: planned           # Sprint 5; Rollenkarte v2 liegt vor (pm/T-0072)
  # --- Domänen-Rollen der Projekt-Teams (Genesis 2.0; Rollenkarten pm/T-0072) ---
  MAIL-RED:
    name: Mail-Redakteur
    besetzung: ki
    provider_chain: [ollama, session]   # Datenklasse sensibel: NIE Cloud-API
    script_tasks: [mail-abholen]        # tools/mail_digest.py (readonly)
    status: active            # Rollenkarte v2 (pm/T-0072); Team team-mail
  DASH-RED:
    name: Dashboard-Redakteur
    besetzung: ki
    provider_chain: [session]
    status: active            # Rollenkarte v2 (pm/T-0072); Team team-dashboard
  PROMPT-OPT:
    name: Prompt- und Kontext-Optimierer
    besetzung: ki
    provider_chain: [session]           # liest Transkripte (sensibel): lokal/Session
    status: active            # Rollenkarte v2 (pm/T-0072); Team promt-team; Meta-Rolle
  MENSCH:
    name: Auftraggeber / Eskalationsinstanz
    besetzung: mensch
    kontakt: geraldine.john90@gmail.com
    gates: [G0, G1, G2, G3, G4]
    status: active
