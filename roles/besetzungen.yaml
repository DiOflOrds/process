# Besetzungs-Registry v2 (Projektmodell/Orga-Rework 2, process/docs/04-projektmodell-orga-rework-2.md;
# v1: Rollenmodell v2, Doc 03). Eine Besetzung = Instanz einer Rolle in genau einer Einheit.
#
# NEU in v2: der core_team-Block. Jedes AKTIVE Projekt (Projekt-Registry teams/registry.yaml
# mit typ aspice|projekt sowie jedes per Discovery gefundene p*-Projekt mit steckbrief-status
# aktiv) hat implizit ALLE Core-Rollen — sie stehen nicht mehr einzeln hier (eine Quelle,
# keine Duplikate: B033). Explizit stehen nur noch:
#   1. ABWEICHUNGEN vom Core-Default (gleicher Instanz-Schlüssel überschreibt die Expansion),
#   2. PROJEKTSPEZIFISCHE Rollen (Domänen-Rollen),
#   3. das PM-Team (kein Projekt -> kein Core Team, Besetzung explizit).
# Auflösung: platform/scripts/organigramm.py `effektive_besetzungen()` — einziger Resolver;
# tick.py (SWR-171), organisation.py (SWR-169/170, HMI) und die Organigramme nutzen ihn.
#
# Schema je Eintrag:
#   besetzungen.<INSTANZ>:            Instanz-ID = <ROLLE>@<einheit>
#     rolle:    Kürzel aus roles/registry.yaml (oder Domänen-Rolle)
#     einheit:  Discovery-Name (z. B. p11, platform, team-mail)
#     motor:    cowork | ollama | api | script | mensch     (Konzept 03, Kap. 4.2)
#     modell:   nur bei ollama/api relevant (z. B. gemma3:27b)
#     takt:     sprint | schnell
#               sprint  = Session-/Sprint-Lauf. Seit pm/D006 ist jeder Session-Lauf ein
#                         vollwertiger Sprint (Register-Takt 60 min) — ein eigener Wert
#                         "session" wäre dieselbe Sache unter zweitem Namen (B033-Falle).
#               schnell = Windows-Aufgabenplanung alle 15 min (F18, pm/D010), nur ollama.
#     status:   aktiv | geplant | pausiert
#     hinweis:  optional
#
# Regeln:
#   - Ollama-Serialisierung: je Team-Node arbeitet nur EINE ollama-Besetzung gleichzeitig
#     (ein geladenes Modell); Vergabe nacheinander nach Prio, dann Fälligkeit.
#   - motor: api ist NICHT aktiviert — F19 entschieden mit NEIN (pm/D011, 0-€-Politik).
#   - takt: schnell ist per F18 freigegeben (pm/D010): Windows-Aufgabenplanung alle 15 min,
#     ollama-schnelltakt.cmd (Einrichtung: ollama-schnelltakt-einrichten.cmd, einmalig).
#   - Max. EINE Instanz je Rolle und Repo — F20 entschieden (pm/D012); Mehrfach erst nach
#     gemessenem Durchsatz-Engpass per Klasse-B-Entscheid.
#   - Pflege: PM-Team (Klasse B, PM-Decision-Log); der Mensch jederzeit direkt (auch via HMI).
#
# Gate-relevante Aufgaben-Typen laufen unabhängig vom Motor immer über die Ketten aus
# roles/registry.yaml (guardrails routing.gate_relevant) — der Motor ist der Startpunkt,
# nicht die Erlaubnis.

# Core Team: gilt implizit für JEDES aktive Projekt (Konzept 04, Kap. 3.1).
core_team:
  rollen: [PL, RM, ARCH, DEV, TEST, QM, CM, PROB, CHG, COACH]
  motor: cowork
  takt: sprint
  status: aktiv

besetzungen:
  # --- PM-Team (kein Projekt — Besetzung explizit; koordiniert alle PL, Charter v1.1) ---
  PL@pm:
    rolle: PL
    einheit: pm
    motor: cowork
    takt: sprint
    status: aktiv
    hinweis: Koordiniert alle PL-Instanzen (Session-Agenda, Prioritäten, Besetzungen)
  QM@pm:
    rolle: QM
    einheit: pm
    motor: cowork
    takt: sprint
    status: aktiv
  COACH@pm:
    rolle: COACH
    einheit: pm
    motor: cowork
    takt: sprint
    status: aktiv
    hinweis: LeLe-Register über alle Projekte; kuratiert Wissensbasen (Lernzyklus)

  # --- Abweichungen vom Core-Team-Default ---
  PROB@platform:
    rolle: PROB
    einheit: platform
    motor: ollama
    modell: gemma3:27b
    takt: schnell        # F18 (pm/D010): Aufgabenplanung alle 15 min, ollama-schnelltakt.cmd
    status: aktiv
    hinweis: Klassifikation/Trend lokal; Ursachenanalyse per Kette auf Claude

  # --- Projektspezifische Rollen (Konzept 04, Kap. 3.2) ---
  MAIL-RED@team-mail:
    rolle: MAIL-RED
    einheit: team-mail
    motor: ollama
    modell: gemma3:27b
    takt: schnell        # F18 (pm/D010): Aufgabenplanung alle 15 min, ollama-schnelltakt.cmd
    status: aktiv
    hinweis: P13 Mail — Datenklasse sensibel, lokal, nie API/Cloud
  DASH-RED@team-dashboard:
    rolle: DASH-RED
    einheit: team-dashboard
    motor: cowork
    takt: sprint
    status: aktiv
    hinweis: P14 Dashboard — fachlicher Auftraggeber der Ergebnis-Darstellung
  PROMPT-OPT@promt-team:
    rolle: PROMPT-OPT
    einheit: promt-team
    motor: cowork
    takt: sprint
    status: aktiv
    hinweis: P15 Prompt — liest Transkripte (sensibel), Vorschläge bleiben Vorschläge
